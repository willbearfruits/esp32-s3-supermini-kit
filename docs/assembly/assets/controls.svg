<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345" role="img" aria-labelledby="title desc">
<title id="title">Joystick and bare encoder logical contacts</title><desc id="desc">Not physical pin order. Joystick powered from 3V3. Encoder common and one push contact go to ground.</desc>
<rect x="0" y="0" width="900" height="345" rx="20" fill="#FAF8F0" stroke="none" stroke-width="2"/>
<rect x="24" y="20" width="414" height="275" rx="12" fill="white" stroke="#C9DDD5" stroke-width="2"/>
<text x="43" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#19393C" text-anchor="start">JOYSTICK BREAKOUT</text>
<text x="43" y="95" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">VCC</text>
<line x1="199" y1="89" x2="289" y2="89" stroke="#007D79" stroke-width="3" stroke-linecap="round"/>
<text x="309" y="95" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">3V3</text>
<text x="43" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">GND</text>
<line x1="199" y1="128" x2="289" y2="128" stroke="#19393C" stroke-width="3" stroke-linecap="round"/>
<text x="309" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GND</text>
<text x="43" y="173" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">VRy</text>
<line x1="199" y1="167" x2="289" y2="167" stroke="#007D79" stroke-width="3" stroke-linecap="round"/>
<text x="309" y="173" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GPIO1</text>
<text x="43" y="212" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">VRx</text>
<line x1="199" y1="206" x2="289" y2="206" stroke="#007D79" stroke-width="3" stroke-linecap="round"/>
<text x="309" y="212" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GPIO2</text>
<text x="43" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">SW</text>
<line x1="199" y1="245" x2="289" y2="245" stroke="#007D79" stroke-width="3" stroke-linecap="round"/>
<text x="309" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GPIO3</text>
<rect x="461" y="20" width="414" height="275" rx="12" fill="white" stroke="#C9DDD5" stroke-width="2"/>
<text x="480" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#19393C" text-anchor="start">BARE EC11 CONTACTS</text>
<text x="480" y="95" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">A</text>
<line x1="636" y1="89" x2="726" y2="89" stroke="#007D79" stroke-width="3" stroke-linecap="round"/>
<text x="746" y="95" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GPIO4</text>
<text x="480" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">B</text>
<line x1="636" y1="128" x2="726" y2="128" stroke="#007D79" stroke-width="3" stroke-linecap="round"/>
<text x="746" y="134" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GPIO5</text>
<text x="480" y="173" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">Common C</text>
<line x1="636" y1="167" x2="726" y2="167" stroke="#19393C" stroke-width="3" stroke-linecap="round"/>
<text x="746" y="173" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GND</text>
<text x="480" y="212" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">Push contact 1</text>
<line x1="636" y1="206" x2="726" y2="206" stroke="#007D79" stroke-width="3" stroke-linecap="round"/>
<text x="746" y="212" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GPIO6</text>
<text x="480" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">Push contact 2</text>
<line x1="636" y1="245" x2="726" y2="245" stroke="#19393C" stroke-width="3" stroke-linecap="round"/>
<text x="746" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#007D79" text-anchor="start">GND</text>
<text x="450" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#53696B" text-anchor="middle">Logical contacts, not physical pin order. Confirm your EC11 pinout before soldering.</text>
</svg>
