<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Two rails and one common ground</title><desc id="desc">USB powers ESP32. 3V3 supplies verified 3.3V modules. Verified USB 5V supplies the regulator-equipped DAC VIN. All grounds join.</desc>
<rect x="0" y="0" width="900" height="300" rx="20" fill="#FAF8F0" stroke="none" stroke-width="2"/>
<rect x="22" y="101" width="106" height="90" rx="13" fill="#19393C" stroke="none" stroke-width="2"/>
<text x="75" y="139" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">USB</text>
<text x="75" y="168" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="white" text-anchor="middle">5 V in</text>
<line x1="128" y1="145" x2="175" y2="145" stroke="#19393C" stroke-width="5" stroke-linecap="round"/>
<rect x="175" y="38" width="260" height="229" rx="14" fill="#DFF2E9" stroke="#007D79" stroke-width="2"/>
<text x="195" y="74" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="bold" fill="#19393C" text-anchor="start">ESP32-S3</text>
<text x="195" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#B74649" text-anchor="start">3V3</text>
<line x1="325" y1="110" x2="510" y2="110" stroke="#B74649" stroke-width="4" stroke-linecap="round"/>
<circle cx="510" cy="110" r="5" fill="#B74649" stroke="none" stroke-width="2"/>
<text x="535" y="107" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#B74649" text-anchor="start">MIC + OLED + JOYSTICK</text>
<text x="535" y="131" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#53696B" text-anchor="start">Verified 3.3 V-compatible boards</text>
<text x="195" y="182" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#D56B30" text-anchor="start">USB 5V*</text>
<line x1="325" y1="176" x2="510" y2="176" stroke="#D56B30" stroke-width="4" stroke-linecap="round"/>
<circle cx="510" cy="176" r="5" fill="#D56B30" stroke="none" stroke-width="2"/>
<text x="535" y="173" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#D56B30" text-anchor="start">PCM5102A VIN*</text>
<text x="535" y="197" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#53696B" text-anchor="start">*Verify board regulator and VIN rating</text>
<text x="195" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#19393C" text-anchor="start">GND</text>
<line x1="325" y1="240" x2="510" y2="240" stroke="#19393C" stroke-width="4" stroke-linecap="round"/>
<circle cx="510" cy="240" r="5" fill="#19393C" stroke="none" stroke-width="2"/>
<text x="535" y="237" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#19393C" text-anchor="start">EVERY MODULE GND</text>
<text x="535" y="261" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" fill="#53696B" text-anchor="start">One common reference</text>
</svg>
